name: easy_pdf_viewer
version: 1.3.0
homepage: https://github.com/SunnatilloShavkatov/easy_pdf_viewer.git
description: "A flutter plugin for handling PDF files. Works on both Android & iOS"

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  analysis_lints: ^1.0.9

flutter:
  plugin:
    platforms:
      android:
        package: dev.kaichi.easy_pdf_viewer
        pluginClass: EasyPdfViewerPlugin
      ios:
        pluginClass: SwiftEasyPdfViewerPlugin
