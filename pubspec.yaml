name: easy_pdf_viewer
version: 1.6.0
homepage: https://github.com/SunnatilloShavkatov/easy_pdf_viewer.git
description: "A flutter plugin for handling PDF files. Works on Android, iOS & macOS"

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  jni: ^1.1.2
  material_ui: ^1.11.0
  objective_c: ^9.6.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  analysis_lints: ^1.1.1
  ffigen: ^23.0.0
  jnigen: ^1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: uz.plugin.easy_pdf_viewer
        pluginClass: EasyPdfViewerPlugin
      ios:
        pluginClass: EasyPdfViewerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: EasyPdfViewerPlugin
        sharedDarwinSource: true
