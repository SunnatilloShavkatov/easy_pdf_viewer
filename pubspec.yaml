name: easy_pdf_viewer
version: 1.4.0
homepage: https://github.com/SunnatilloShavkatov/easy_pdf_viewer.git
description: "A flutter plugin for handling PDF files. Works on both Android & iOS"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  analysis_lints: ^1.1.0

flutter:
  plugin:
    platforms:
      android:
        package: uz.plugin.easy_pdf_viewer
        pluginClass: EasyPdfViewerPlugin
      ios:
        pluginClass: SwiftEasyPdfViewerPlugin
