name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: 'pub.dev'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --dry-run
      - run: flutter pub publish -y
