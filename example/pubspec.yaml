name: easy_pdf_viewer_example
version: 1.5.0+1
publish_to: "none"
description: "Demonstrates how to use the easy_pdf_viewer plugin."

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  easy_pdf_viewer:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analysis_lints: ^1.1.1

flutter:

  uses-material-design: true

  assets:
    - assets/sample.pdf
    - assets/sample2.pdf
