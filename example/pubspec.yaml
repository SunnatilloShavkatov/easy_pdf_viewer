name: easy_pdf_viewer_example
version: 1.3.1+1
publish_to: "none"
description: "Demonstrates how to use the easy_pdf_viewer plugin."

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  easy_pdf_viewer:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  analysis_lints: ^1.0.9

flutter:

  uses-material-design: true

  assets:
    - assets/sample.pdf
    - assets/sample2.pdf
